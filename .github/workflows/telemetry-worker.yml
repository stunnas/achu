name: Telemetry worker

on:
  pull_request:
    paths:
      - 'telemetry-worker/**'
      - '.github/workflows/telemetry-worker.yml'
  push:
    branches:
      - main
    paths:
      - 'telemetry-worker/**'
      - '.github/workflows/telemetry-worker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run deploy:dry
